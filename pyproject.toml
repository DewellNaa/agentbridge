[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbridge"
version = "0.1.0"
description = "Ultra-lightweight local AI coding agent gateway & protocol bridge for Claude Code, Cursor, and Aider"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "DewellNaa", email = "210961864+DewellNaa@users.noreply.github.com" },
]
keywords = [
    "claude-code",
    "ai-agent",
    "gateway",
    "reverse-proxy",
    "deepseek",
    "glm",
    "anthropic",
    "openai",
    "mcp",
    "sse",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
agentbridge = "agentbridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbridge"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
